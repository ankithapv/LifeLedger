
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeledger-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - ./backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: lifeledger-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
