
services:
  backend:
    image: annapurnakl/lifeledger-backend:v1
    container_name: lifeledger-test-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - ./backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: annapurnakl/lifeledger-frontend:v1
    container_name: lifeledger-test-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
